# Include once inside the tenali.fun server block:  include /etc/nginx/snippets/v2.conf;
# Rollback = delete that include line and reload nginx.
# Files live under /var/www/v2 (index.html = landing, fln/, tenali/).

location = /v2 { return 301 /v2/; }

# FLN API. Bodies up to 10 MB (a resized phone photo); photo reading can take a while, so the timeouts are longer.
location /v2/api/fln/ {
    client_max_body_size 10m;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_pass http://127.0.0.1:3100/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
# Tenali API: not built yet.
location /v2/api/tenali/ { proxy_pass http://127.0.0.1:3200/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

# Web apps (single-page: unknown paths fall back to the app's index.html). Built files never change name, so they cache for a year.
location /v2/fln/assets/ { root /var/www; expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
location /v2/fln/    { root /var/www; add_header Cache-Control "no-cache"; try_files $uri $uri/ /v2/fln/index.html; }
location /v2/tenali/ { root /var/www; try_files $uri $uri/ /v2/tenali/index.html; }

# Landing page (static)
location /v2/ { root /var/www; index index.html; try_files $uri $uri/ =404; }
