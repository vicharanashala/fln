<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLN and Tenali, version 2</title>
<meta name="description" content="One learning path from Balvatika to Class 12: FLN for Classes 3 and below, Tenali for Classes 4 and above.">
<style>
  :root {
    --cream: #f7eddc; --cream-2: #fff8ec; --sand: #ead9bb;
    --brown: #4a2e1f; --brown-2: #7a5238; --line: #dcc7a2;
    --red: #c8402b; --orange: #e8892b; --gold: #f0b44c;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body { margin: 0; background: var(--cream); color: var(--brown); overflow-x: hidden;
         font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 48px 16px 64px; position: relative; z-index: 1; }

  /* drifting background shapes */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg i { position: absolute; border-radius: 50%; opacity: .16; animation: drift 18s ease-in-out infinite; }
  .bg i:nth-child(1) { width: 260px; height: 260px; background: var(--orange); left: -70px; top: 8%; }
  .bg i:nth-child(2) { width: 180px; height: 180px; background: var(--red); right: -40px; top: 30%; animation-delay: -6s; }
  .bg i:nth-child(3) { width: 320px; height: 320px; background: var(--gold); left: 40%; bottom: -150px; animation-delay: -11s; }
  @keyframes drift { 0%,100% { transform: translate(0,0) } 50% { transform: translate(24px,-30px) } }

  h1 { font-size: clamp(2.1rem, 6vw, 3.4rem); line-height: 1.1; margin: 0 0 8px; text-align: center; letter-spacing: -.01em; }
  h1 em { font-style: normal; color: var(--red); }
  .sub { text-align: center; color: var(--brown-2); margin: 0 0 36px; font-size: 1.1rem; }
  .rise { opacity: 0; transform: translateY(14px); animation: rise .7s ease forwards; }
  .rise.d2 { animation-delay: .15s; } .rise.d3 { animation-delay: .3s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .stages { display: grid; gap: 20px; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .stages { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--cream-2); border: 2px solid var(--line); border-radius: 22px; padding: 22px;
          display: flex; flex-direction: column; align-items: center; text-align: center;
          transition: transform .25s ease, box-shadow .25s ease; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(74,46,31,.14); }
  .card h2 { margin: 8px 0 0; font-size: 1.5rem; }
  .card .tag { margin: 2px 0 0; color: var(--brown-2); font-size: .95rem; }
  .stage { height: 190px; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 10px; padding-bottom: 6px; }

  /* FLN: alphabet-and-number blocks that drop in; click to jump */
  .blk { width: 58px; height: 58px; border: 0; border-radius: 12px; font: 700 1.7rem/1 inherit; color: var(--cream-2);
         cursor: pointer; box-shadow: 0 5px 0 rgba(74,46,31,.28); opacity: 0; transform: translateY(-160px);
         animation: drop .8s cubic-bezier(.3,1.5,.5,1) forwards; }
  .blk:nth-child(1) { background: var(--red); animation-delay: .2s; }
  .blk:nth-child(2) { background: var(--orange); color: var(--brown); animation-delay: .38s; }
  .blk:nth-child(3) { background: var(--brown-2); animation-delay: .56s; }
  .blk:nth-child(4) { background: var(--gold); color: var(--brown); animation-delay: .74s; }
  .blk:focus-visible, .bar:focus-visible, .btn:focus-visible { outline: 3px solid var(--brown); outline-offset: 3px; }
  @keyframes drop { to { opacity: 1; transform: none; } }
  .blk.hop { animation: hop .5s ease; }
  @keyframes hop { 40% { transform: translateY(-34px) rotate(-6deg); } 100% { transform: none; } }

  /* Tenali: staircase that grows, a dot that climbs on click */
  .stairs { position: relative; display: flex; align-items: flex-end; gap: 8px; height: 170px; }
  .bar { width: 46px; border: 0; border-radius: 10px 10px 0 0; cursor: pointer; transform-origin: bottom; transform: scaleY(0);
         animation: grow .7s cubic-bezier(.3,1.4,.5,1) forwards; box-shadow: inset 0 -4px 0 rgba(74,46,31,.18); }
  .bar:nth-child(1) { height: 40px;  background: var(--gold);   animation-delay: .2s; }
  .bar:nth-child(2) { height: 70px;  background: var(--orange); animation-delay: .35s; }
  .bar:nth-child(3) { height: 100px; background: #d9622b;       animation-delay: .5s; }
  .bar:nth-child(4) { height: 130px; background: var(--red);    animation-delay: .65s; }
  .bar:nth-child(5) { height: 160px; background: #9d2f22;       animation-delay: .8s; }
  @keyframes grow { to { transform: scaleY(1); } }
  .dot { position: absolute; left: 4px; bottom: 44px; width: 22px; height: 22px; border-radius: 50%; background: var(--brown);
         border: 3px solid var(--cream-2); transition: left .45s cubic-bezier(.3,1.5,.5,1), bottom .45s cubic-bezier(.3,1.5,.5,1); pointer-events: none; }

  .btn { display: inline-block; margin-top: 14px; padding: 13px 22px; border-radius: 999px; text-decoration: none; font-weight: 700;
         position: relative; overflow: hidden; transition: transform .2s ease, box-shadow .2s ease; }
  .btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 18px rgba(74,46,31,.22); }
  .btn:active { transform: scale(.97); }
  .btn.fln { background: var(--red); color: var(--cream-2); }
  .btn.tenali { background: var(--orange); color: var(--brown); }
  .btn .arrow { display: inline-block; transition: transform .2s ease; margin-left: 6px; }
  .btn:hover .arrow { transform: translateX(5px); }

  footer { margin-top: 56px; text-align: center; color: var(--brown-2); font-size: .9rem; }

  .more { display: inline-block; margin-top: 12px; color: var(--brown-2); font-weight: 600; text-decoration: none; border-bottom: 2px solid var(--line); padding-bottom: 1px; transition: color .2s ease, border-color .2s ease; }
  .more:hover { color: var(--red); border-color: var(--red); }
  .more:focus-visible { outline: 3px solid var(--brown); outline-offset: 3px; }

  /* confetti burst on click */
  .pop { position: fixed; width: 10px; height: 10px; border-radius: 2px; pointer-events: none; z-index: 5; animation: pop .8s ease-out forwards; }
  @keyframes pop { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .rise, .blk { opacity: 1; transform: none; }
    .bar { transform: none; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <h1 class="rise">Every child, <em>every class</em></h1>
  <p class="sub rise d2">One learning path from Balvatika to Class 12</p>

  <div class="stages rise d3">
    <section class="card" aria-labelledby="fln-h">
      <div class="stage" role="group" aria-label="Alphabet and number blocks. Press a block to make it jump.">
        <button class="blk" type="button" aria-label="Block A">A</button>
        <button class="blk" type="button" aria-label="Block 1">1</button>
        <button class="blk" type="button" aria-label="Block B">B</button>
        <button class="blk" type="button" aria-label="Block 2">2</button>
      </div>
      <h2 id="fln-h">FLN</h2>
      <p class="tag">Reading and counting, the first steps</p>
      <a class="btn fln" href="/v2/fln/">Classes 3 and below<span class="arrow" aria-hidden="true">&rarr;</span></a>
      <a class="more" href="/v2/why-fln/">Why FLN?</a>
    </section>

    <section class="card" aria-labelledby="tenali-h">
      <div class="stage" role="group" aria-label="A staircase. Press a step to make the dot climb to it.">
        <div class="stairs">
          <button class="bar" type="button" aria-label="Step 1"></button>
          <button class="bar" type="button" aria-label="Step 2"></button>
          <button class="bar" type="button" aria-label="Step 3"></button>
          <button class="bar" type="button" aria-label="Step 4"></button>
          <button class="bar" type="button" aria-label="Step 5"></button>
          <span class="dot" aria-hidden="true"></span>
        </div>
      </div>
      <h2 id="tenali-h">Tenali</h2>
      <p class="tag">Practice that climbs with the child</p>
      <a class="btn tenali" href="/v2/tenali/">Classes 4 and above<span class="arrow" aria-hidden="true">&rarr;</span></a>
      <a class="more" href="/v2/why-tenali/">Why Tenali?</a>
    </section>
  </div>

  <footer>Version 2 preview &middot; Vicharanashala Lab for Education Design, IIT Ropar</footer>
</main>

<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var colors = ['#c8402b', '#e8892b', '#f0b44c', '#7a5238'];

  function burst(x, y) {
    if (reduce) return;
    for (var i = 0; i < 14; i++) {
      var p = document.createElement('span');
      p.className = 'pop';
      p.style.left = x + 'px'; p.style.top = y + 'px';
      p.style.background = colors[i % colors.length];
      var a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 60;
      p.style.setProperty('--x', Math.cos(a) * d + 'px');
      p.style.setProperty('--y', Math.sin(a) * d - 20 + 'px');
      p.style.setProperty('--r', Math.round(Math.random() * 360) + 'deg');
      document.body.appendChild(p);
      setTimeout(function (el) { el.remove(); }.bind(null, p), 900);
    }
  }
  function centre(el) { var r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }

  document.querySelectorAll('.blk').forEach(function (b) {
    b.addEventListener('click', function () {
      b.classList.remove('hop'); void b.offsetWidth; b.classList.add('hop');
      var c = centre(b); burst(c[0], c[1]);
    });
  });

  var dot = document.querySelector('.dot');
  document.querySelectorAll('.bar').forEach(function (bar) {
    bar.addEventListener('click', function () {
      var s = bar.parentElement;
      dot.style.left = (bar.offsetLeft + bar.offsetWidth / 2 - 11) + 'px';
      dot.style.bottom = (bar.offsetHeight + 6) + 'px';
      var c = centre(bar); burst(c[0], c[1] - bar.offsetHeight / 2);
    });
  });
  // start the dot on the first step
  window.addEventListener('load', function () {
    var first = document.querySelector('.bar');
    if (first) { dot.style.left = (first.offsetLeft + first.offsetWidth / 2 - 11) + 'px'; dot.style.bottom = (first.offsetHeight + 6) + 'px'; }
  });

})();
</script>
</body>
</html>
