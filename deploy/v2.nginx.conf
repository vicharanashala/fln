# Include once inside the tenali.fun server block:  include /etc/nginx/snippets/v2.conf;
# Rollback = delete that include line and reload nginx.
# Files live under /var/www/v2 (index.html = landing, fln/, tenali/).

location = /v2 { return 301 /v2/; }

# FLN API. Bodies up to 10 MB (a resized phone photo); photo reading can take a while, so the timeouts are longer.
location /v2/api/fln/ {
    client_max_body_size 10m;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_pass http://127.0.0.1:3100/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
# FLN web app (single-page: unknown paths fall back to the app's index.html). Built files never change name, so they cache for a year.
location /v2/fln/assets/ { root /var/www; expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
location /v2/fln/    { root /var/www; add_header Cache-Control "no-cache"; try_files $uri $uri/ /v2/fln/index.html; }

# Tenali: one Node process serves the app and its APIs on port 3200; nginx strips /v2/tenali, the same way as for /summership.
# The same two protections the live server applies to its other Tenali paths: the code-playground run endpoint
# (matched by the server-wide rule for every prefix) and the proctoring and emotion history routes stay closed.
location = /v2/tenali { return 301 /v2/tenali/; }
location ~* ^/v2/tenali/api/(proctor/sessions/?|proctor/session/.*|emotions/history/?)$ { return 403; }
location /v2/tenali/ {
    client_max_body_size 6m;
    proxy_pass http://127.0.0.1:3200/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Needed for the live (Socket.IO) battle and multiplayer features.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
}

# Landing page (static)
location /v2/ { root /var/www; index index.html; try_files $uri $uri/ =404; }
