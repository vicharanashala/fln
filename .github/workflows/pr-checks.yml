name: PR checks

# Does this change leave the repo working?
#
# Until now nothing ran on pull requests that could catch broken code: the
# repo health check runs only AFTER a merge to main (and daily), and the PR
# gate is deliberately comment-only and never runs PR code. This workflow
# closes that gap.
#
# On `pull_request`, GitHub checks out the MERGE of the PR into main, so these
# checks run against the code that would actually land — a fix that breaks a
# file elsewhere shows up here, not on main afterwards. It runs with a
# read-only token and no secrets, so it is safe for pull requests from forks.
#
# Everything is in scripts/ci/pr-checks.sh so it can be run locally too:
#   npm run check:pr            (all groups)
#   npm run check:pr -- types   (one group)
#
# One job per group, so the pull request shows each as its own check and a failure
# says which part broke without opening a log. To make this a hard gate, mark the
# jobs you want (e.g. "PR checks / Type check") as required status checks in
# Settings > Branches > main. Add a group: add it to the script and to the matrix.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false   # one failing group must not hide the others
      matrix:
        include:
          - { group: consistency,    label: Consistency }
          - { group: types,          label: Type check }
          - { group: eslint,         label: ESLint }
          - { group: tests-backend,  label: Backend tests }
          - { group: tests-frontend, label: Frontend tests }
          - { group: build,          label: Build }
          - { group: routes,         label: Routes }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the merge commit and its first parent (the base)

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci   # fails if package-lock.json is out of step with package.json

      - name: Run ${{ matrix.label }}
        env:
          PR_CHECKS_REPORT: pr-checks-report/${{ matrix.group }}.md
          PR_CHECKS_LABEL: ${{ matrix.label }}
        run: bash scripts/ci/pr-checks.sh ${{ matrix.group }}

      # The comment bot (pr-checks-comment.yml) reads these. They are kept even when
      # the checks fail, which is exactly when the report is needed.
      - name: Keep the report for the comment bot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-checks-report-${{ matrix.group }}
          path: pr-checks-report/${{ matrix.group }}.md
          if-no-files-found: ignore
          retention-days: 3
