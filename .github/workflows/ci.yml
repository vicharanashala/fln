name: ci
on:
  push:
    branches: [rebuild/v2]
  pull_request:
    branches: [rebuild/v2]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
