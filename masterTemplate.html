<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLN Worksheet</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Noto Sans", Arial, sans-serif;
}

body{
    background:#ffffff;
    color:#000;
}

.page{
    width:210mm;
    min-height:297mm;
    margin:auto;
    padding:18mm;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    border-bottom:2px solid #000;
    padding-bottom:12px;
    margin-bottom:20px;
}

.student-details{
    flex:1;
    margin-right:30px;
}

.student-details h2{
    font-size:22px;
    margin-bottom:15px;
}

.info-row{
    display:flex;
    margin-bottom:10px;
}

.label{
    width:150px;
    font-weight:bold;
}

.value{
    flex:1;
    border-bottom:1px solid #555;
    min-height:22px;
    padding-left:6px;
}

.qr-section{
    width:120px;
    text-align:center;
}

.qr-box{
    width:100px;
    height:100px;
    border:2px dashed #777;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
}

.qr-box img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.page-info{
    display:flex;
    justify-content:space-between;
    margin-bottom:25px;
    font-size:15px;
}

.page-info div{
    flex:1;
}

.worksheet-content{
    min-height:700px;
}

.footer{
    margin-top:30px;
    border-top:1px solid #000;
    padding-top:10px;
    display:flex;
    justify-content:space-between;
    font-size:13px;
}

@media print{

    body{
        margin:0;
    }

    .page{
        width:100%;
        min-height:auto;
        margin:0;
        padding:15mm;
    }

}
</style>

</head>

<body>

<div class="page">

    <!-- HEADER -->
    <div class="header">

        <div class="student-details">

            <h2>FLN Assessment Worksheet</h2>

            <div class="info-row">
                <div class="label">Student Name</div>
                <div class="value">{{student_name}}</div>
            </div>

            <div class="info-row">
                <div class="label">Father's Name</div>
                <div class="value">{{father_name}}</div>
            </div>

        </div>

        <div class="qr-section">

            <div class="qr-box">
                <img src="{{qr_code}}" alt="QR Code">
            </div>

            <small>QR Code</small>

        </div>

    </div>

    <!-- PAGE INFORMATION -->

    <div class="page-info">

        <div>
            <strong>Level:</strong> {{level}}
        </div>

        <div>
            <strong>Worksheet ID:</strong> {{worksheet_id}}
        </div>

        <div>
            <strong>Language:</strong> {{language}}
        </div>

    </div>

    <!-- BODY -->

    <div class="worksheet-content">

        {{worksheet_content}}

    </div>

    <!-- FOOTER -->

    <div class="footer">

        <div>
            Generated by FLN Assessment Platform
        </div>

        <div>
            Page {{page_number}} / {{total_pages}}
        </div>

    </div>

</div>

</body>
</html>
